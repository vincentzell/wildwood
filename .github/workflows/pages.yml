name: Deploy WildStat (fork perso)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            spacetimedb/package-lock.json

      - name: Build client
        run: |
          npm ci
          npm ci --prefix mobile
          npm ci --prefix spacetimedb
          npm run build:client
          node scripts/check-client-build.mjs

      - name: Keep site build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 1

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            spacetimedb/package-lock.json

      - name: Typecheck client and server
        run: |
          npm ci
          npm ci --prefix mobile
          npm ci --prefix spacetimedb
          npm run typecheck:coop
          npm run typecheck:server

  deploy:
    needs: [build, typecheck]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.typecheck.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Restore site build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5