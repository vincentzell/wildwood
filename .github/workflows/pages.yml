jobs:
  build:
    # ... (identique à l'option 1)
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            spacetimedb/package-lock.json
      - name: Typecheck
        run: |
          npm ci
          npm ci --prefix mobile
          npm ci --prefix spacetimedb
          npm run typecheck:coop
  deploy:
    needs: [build, typecheck]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.typecheck.result == 'success' }}
